        body {

            min-height: 100vh;
        }

        .heading-font {
            font-family: 'Rozha One', 'Noto Sans Devanagari', serif;
        }

        /* Light Theme Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.9);

            border: 1.5px solid #f59e0b;
            color: #92400e;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .glass-btn:hover {

            border-color: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.2);
        }

        .light-subcard {
            background: #ffffff;
            border-left: 5px solid #dc2626;
            border-top: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 7px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Slide Transition Animations */
        .slide-enter {
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Toast Popup */
        #toast {
            transition: all 0.3s ease;
            transform: translateY(80px);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Pulse for Speech */
        .speaking-pulse {
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        // Global State Variables

            slideCounter.innerText = `स्लाइड ${currentIndex + 1} / ${slidesData.length}`;

        // Text-To-Speech Engine (Hindi hi-IN)
        function toggleSpeech() {
            if (!('speechSynthesis' in window)) {
                showToast("आपका ब्राउज़र वॉइस वाचन का समर्थन नहीं करता है।");
                return;
            }

            if (isSpeaking) {
                if (isSpeechPaused) {
                    speechSynth.resume();
                    isSpeechPaused = false;
                    updateSpeechUI(true, "पढ़ रहे हैं...");
                } else {
                    speechSynth.pause();
                    isSpeechPaused = true;
                    updateSpeechUI(true, "रुक गए हैं");
                }
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            speechSynth.cancel();

            const data = slidesData[currentIndex];
            let fullText = "";

            if (data.type === 'cover') {
                fullText = `${data.title}. ${data.subtitle}. ${data.badge}. `;
                data.cards.forEach(c => { fullText += `${c.title}, ${c.desc}. `; });
            } else {
                fullText = `${data.qNum}. ${data.question}. उत्तर: `;
                data.sections.forEach(sec => {
                    fullText += `${sec.title} ${sec.text}. `;
                });
            }

            speechUtterance = new SpeechSynthesisUtterance(fullText);
            speechUtterance.lang = 'hi-IN';
            speechUtterance.rate = 0.95;
            speechUtterance.pitch = 1.0;

            const voices = speechSynth.getVoices();
            const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('HI'));
            if (hindiVoice) {
                speechUtterance.voice = hindiVoice;
            }

            speechUtterance.onstart = () => {
                isSpeaking = true;
                isSpeechPaused = false;
                updateSpeechUI(true, "सुन रहे हैं");
            };

            speechUtterance.onend = () => {
                isSpeaking = false;
                isSpeechPaused = false;
                updateSpeechUI(false, "बोलकर सुनें");
            };

            speechUtterance.onerror = () => {
                isSpeaking = false;
                isSpeechPaused = false;
                updateSpeechUI(false, "बोलकर सुनें");
            };

            speechSynth.speak(speechUtterance);
        }

        function stopSpeech() {
            if (speechSynth) speechSynth.cancel();
            isSpeaking = false;
            isSpeechPaused = false;
            updateSpeechUI(false, "बोलकर सुनें");
        }

        function updateSpeechUI(speaking, textLabel) {
            const btnIcon = document.getElementById('speechBtnIcon');
            const btnText = document.getElementById('speechBtnText');
            const cardIcon = document.getElementById('cardAudioIcon');
            const cardText = document.getElementById('cardAudioText');
            const globalBtn = document.getElementById('globalSpeechBtn');

            if (speaking && !isSpeechPaused) {
                if (btnIcon) btnIcon.className = "fa-solid fa-pause text-red-600 animate-pulse";
                if (btnText) btnText.innerText = "रोकें";
                if (cardIcon) cardIcon.className = "fa-solid fa-pause";
                if (cardText) cardText.innerText = "रोकें";
                if (globalBtn) globalBtn.classList.add('speaking-pulse', 'border-red-500');
            } else {
                if (btnIcon) btnIcon.className = "fa-solid fa-volume-high text-red-600";
                if (btnText) btnText.innerText = textLabel || "बोलकर सुनें";
                if (cardIcon) cardIcon.className = "fa-solid fa-volume-high";
                if (cardText) cardText.innerText = "सुनें";
                if (globalBtn) globalBtn.classList.remove('speaking-pulse', 'border-red-500');
            }
        }

        // Navigation Functions
        function nextSlide() {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back to Cover
            }
            renderSlide();
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentIndex = index;
            renderSlide();
            if (!drawer.classList.contains('pointer-events-none')) {
                toggleDrawer();
            }
        }

        function renderDots() {
            dotsContainer.innerHTML = slidesData.map((_, idx) => `
                <button onclick="goToSlide(${idx})" title="${idx === 0 ? 'कवर पेज' : 'स्लाइड ' + idx}" class="w-3 h-3 rounded-full transition-all duration-300 ${idx === currentIndex ? 'bg-red-600 w-8 shadow-sm' : 'bg-slate-300 hover:bg-slate-400'}">
                </button>
            `).join('');
        }

        function updateDots() {
            renderDots();
        }

        function updateProgress() {
            const percentage = ((currentIndex + 1) / slidesData.length) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        // Drawer Menu Render
        function renderDrawerItems() {
            drawerList.innerHTML = slidesData.map((item, idx) => {
                if (item.type === 'cover') {
                    return `
                        <div onclick="goToSlide(0)" class="p-3.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 cursor-pointer transition flex items-center gap-3 group">
                            <span class="px-2.5 py-1 rounded-lg bg-amber-200 text-amber-900 font-extrabold text-xs shrink-0">
                                कवर
                            </span>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs md:text-sm font-bold text-amber-900 group-hover:text-amber-950">
                                    'लता मंगेशकर' - मुख्य पृष्ठ
                                </p>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div onclick="goToSlide(${idx})" class="p-3.5 rounded-xl bg-slate-50 hover:bg-red-50/60 border border-slate-200 cursor-pointer transition flex items-start gap-3 group">
                        <span class="px-2.5 py-1 rounded-lg bg-red-100 text-red-700 font-extrabold text-xs shrink-0 border border-red-200">
                            ${idx}
                        </span>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs md:text-sm font-bold text-slate-800 group-hover:text-red-700 line-clamp-2 leading-snug">
                                ${item.qNum}
                            </p>
                            <p class="text-[11px] text-slate-500 font-semibold mt-1">
                                प्रकार: ${item.marks}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleDrawer() {
            if (drawer.classList.contains('pointer-events-none')) {
                drawer.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                drawer.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Font Resize
        function changeFontSize(delta) {
            const newOffset = currentFontSizeOffset + delta;
            if (newOffset >= -1 && newOffset <= 2) {
                currentFontSizeOffset = newOffset;
                renderSlide();
                const labels = { '-1': 'छोटा', '0': 'सामान्य', '1': 'बड़ा', '2': 'बहुत बड़ा' };
                showToast(`अक्षर आकार: ${labels[newOffset]}`);
            }
        }

        // Auto-Play Feature
        function toggleAutoplay() {
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');
            const autoplayBtn = document.getElementById('autoplayBtn');

            if (isAutoplay) {
                clearInterval(autoplayInterval);
                isAutoplay = false;
                playIcon.className = "fa-solid fa-play text-emerald-600";
                playText.innerText = "ऑटो प्ले";
                autoplayBtn.classList.remove('border-emerald-500', 'bg-emerald-50');
                showToast("ऑटो प्ले बंद किया गया");
            } else {
                isAutoplay = true;
                playIcon.className = "fa-solid fa-pause text-amber-600";
                playText.innerText = "रुकें";
                autoplayBtn.classList.add('border-emerald-500', 'bg-emerald-50');
                showToast("ऑटो प्ले चालू (प्रत्येक 8 सेकंड)");
                autoplayInterval = setInterval(() => {
                    nextSlide();
                }, 8000);
            }
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            const icon = document.getElementById('fullscreenIcon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {
                    showToast("फुलस्क्रीन मोड समर्थित नहीं है");
                });
                icon.className = "fa-solid fa-compress";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.className = "fa-solid fa-expand";
                }
            }
        }

        // Copy Text Function
        function copyCurrentSlideText() {
            const data = slidesData[currentIndex];
            let textToCopy = "";

            if (data.type === 'cover') {
                textToCopy = `${data.title}\n${data.subtitle}\n${data.badge}\n`;
            } else {
                textToCopy = `${data.qNum} (${data.marks})\n${data.question}\n\n`;
                textToCopy += `उत्तर:\n`;
                data.sections.forEach(sec => {
                    textToCopy += `\n${sec.title}\n${sec.text}\n`;
                });
            }

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast("सामग्री कॉपी हो गई है!");
            } catch (err) {
                showToast("कॉपी करने में असमर्थ");
            }
            document.body.removeChild(textarea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2400);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'Escape') {
                if (!drawer.classList.contains('pointer-events-none')) {
                    toggleDrawer();
                }
            }
        });

        // Touch Swipe
        function setupTouchSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            function handleSwipe() {
                const swipeThreshold = 50;
                if (touchEndX < touchStartX - swipeThreshold) {
                    nextSlide();
                }
                if (touchEndX > touchStartX + swipeThreshold) {
                    prevSlide();
                }
            }
        }

        // Pre-fetch voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Start Application
        window.onload = init;
    </script>
</body>
</html>
